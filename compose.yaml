name: jira-data

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  loader:
    build: ./loader
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ANALYST_USER: ${ANALYST_USER:?Set ANALYST_USER in .env}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Set ANALYST_PASSWORD in .env}
      SOURCE_DIR: /data/source
    volumes:
      - ./data/source:/data/source:ro
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    entrypoint: ["/bin/sh", "/pgadmin-init.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /var/lib/pgadmin/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ANALYST_USER: ${ANALYST_USER:?Set ANALYST_USER in .env}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Set ANALYST_PASSWORD in .env}
    volumes:
      - ./pgadmin/init.sh:/pgadmin-init.sh:ro
      - pgadmin:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      loader:
        condition: service_completed_successfully

  metabase:
    image: metabase/metabase:v0.63.14.1
    entrypoint: ["/bin/sh", "/metabase-init.sh"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
      METABASE_EMAIL: ${METABASE_EMAIL:?Set METABASE_EMAIL in .env}
      METABASE_PASSWORD: ${METABASE_PASSWORD:?Set METABASE_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      ANALYST_USER: ${ANALYST_USER:?Set ANALYST_USER in .env}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:?Set ANALYST_PASSWORD in .env}
    volumes:
      - ./metabase/init.sh:/metabase-init.sh:ro
      - metabase:/metabase-data
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      loader:
        condition: service_completed_successfully

  files:
    image: nginx:1.27-alpine
    volumes:
      - ./data/source:/usr/share/nginx/html:ro
      - ./downloads/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FILES_PORT:-8080}:80"

volumes:
  pgdata:
  pgadmin:
  metabase:
